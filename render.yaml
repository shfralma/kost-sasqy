services:
  - type: web
    name: kost-sasqy
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: SASQY_ADMIN_PASSWORD
        generateValue: true
      - key: MYSQL_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
